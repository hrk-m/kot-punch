name: Codex pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Pull GitHub MCP Server image
        run: docker pull ghcr.io/github/github-mcp-server

      - name: Configure Codex MCP for inline PR reviews
        run: |
          mkdir -p "${{ runner.temp }}/codex-home"
          cat > "${{ runner.temp }}/codex-home/config.toml" <<'EOF'
          [mcp_servers.github_inline_comment]
          command = "docker"
          args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "-e", "GITHUB_TOOLSETS", "ghcr.io/github/github-mcp-server", "stdio"]
          required = true
          startup_timeout_sec = 120
          tool_timeout_sec = 180
          env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN", "GITHUB_TOOLSETS"]
          enabled_tools = ["pull_request_read", "pull_request_review_write", "add_comment_to_pending_review"]
          EOF

      - name: PR Review with Progress Tracking
        id: run_codex
        uses: openai/codex-action@086169432f1d2ab2f4057540b1754d550f6a1189 # v1
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
          GITHUB_TOOLSETS: pull_requests
          CODEX_MODEL: gpt-5.4
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          output-file: codex-output.json
          safety-strategy: drop-sudo
          sandbox: workspace-write
          prompt: |
            REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}

            このリポジトリは Stream Deck プラグイン（TypeScript + Rollup + Vitest）です。
            レビュー晤 `AGENTS.md` と `docs/architecture.md` を参照し、以下の方針で確認してください。

            レビュー標準:
            - design / functionality / complexity / tests / naming / comments / style / consistency / documentation の順で確認する
            - 変更行だけでなく周辺コンテキストも読む（全差分を網羅）
            - 完璧さより「コードヘルスを確実に改善しているか」を重視する
            - 指摘は重要度順に優先し、些細な nit だけでレビューを埋めない

            プロジェクト固有チェック:
            - `src/plugin.ts` はアクション登録と `streamDeck.connect()` の責務に留まっているか
            - `src/actions/*.ts` で `SingletonAction<Settings>` / `@action({ UUID })` の実装が適切か
            - `com.hrk-m.kot-punch.sdPlugin/manifest.json` の `Actions` / UUID / UI / アイコン / Tooltip が実装と整合しているか
            - `onKeyUp` で `_isProcessing` ガードによる連打防止と State 0/1 の切り替えが正しいか
            - Multi Action (`isInMultiAction`, `userDesiredState`) の状態制御が正しいか
            - Vitest（モック含む）のテストが変更に追随しているか
            - 型安全性、可読性、保守性、潜在バグ、セキュリティ上の懸念

            コメント運用ルール:
            - すべて日本語
            - インラインコメントは改善点・懸念点・バグ可能性のみ（肯定コメントは禁止）
            - 指摘がある場合は `mcp__github_inline_comment__pull_request_review_write` で pending review を作成し、`mcp__github_inline_comment__add_comment_to_pending_review` で各指摘をインライン追加して、最後に `mcp__github_inline_comment__pull_request_review_write` で event=COMMENT として submit する
            - 各コメントは先頭を `[MUST]` / `[SHOULD]` / `[NIT]` / `[FYI]` で始める
            - 各コメントは先頭1行で結論を示し、その後に「理由」「修正案」を書く
            - 修正方針が明確な場合は suggestion を使う
            - レビュー提出時の総括コメントは空文字列("")、`REQUEST_CHANGES` は使わない

            問題なし時の自動コメント:
            - レビューで指摘事項が 0 件だった場合は、以下のテンプレートで `gh pr comment` を使ってコメントを投稿する
            - コマンド例: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "..."
            - テンプレート（観点ごとの結果を表形式で示し、最後に「指摘事項はありません。」で締める）:
              ```
              ## Codex レビュー結果: 問題なし ✅

              | 観点 | 結果 |
              |------|------|
              | 保守性・可読性 | ✅ 問題なし |
              | 設計・アーキテクチャ | ✅ 問題なし |
              | コード品質 | ✅ 問題なし |
              | 潜在的なバグ | ✅ 問題なし |
              | セキュリティ | ✅ 問題なし |
              | テストの追随 | ✅ 問題なし |

              指摘事項はありません。
              ```
            - 各行の「問題なし」は実際の確認内容を 1 行で具体的に書き換える
            - 指摘事項が 1 件でもある場合はこのコメントを投稿しない
