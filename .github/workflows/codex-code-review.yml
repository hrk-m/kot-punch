name: PR Review with Progress Tracking

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-with-tracking:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Fetch pull request diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --header "Accept: application/vnd.github.v3.diff" \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} > pr.diff

      - name: Build Codex prompt
        run: |
          cat <<'EOF' > codex-review-prompt.md
          このリポジトリは Stream Deck プラグイン（TypeScript + Rollup + Vitest）です。
          レビュー時は `CLAUDE.md` と `docs/architecture.md` を参照し、以下の方針で確認してください。

          レビュー標準:
          - design / functionality / complexity / tests / naming / comments / style / consistency / documentation の順で確認する
          - 変更行だけでなく周辺コンテキストも読む（全差分を網羅）
          - 完璧さより「コードヘルスを確実に改善しているか」を重視する
          - 指摘は重要度順に優先し、些細な nit だけでレビューを埋めない

          プロジェクト固有チェック:
          - `src/plugin.ts` はアクション登録と `streamDeck.connect()` の責務に留まっているか
          - `src/actions/*.ts` で `SingletonAction<Settings>` / `@action({ UUID })` の実装が適切か
          - `com.hrk-m.kot-punch.sdPlugin/manifest.json` の `Actions` / UUID / UI / アイコン / Tooltip が実装と整合しているか
          - `onKeyDown` / `onKeyUp` の長押し判定タイマー、`clearTimeout`、短押し/長押し分岐が安全か
          - Multi Action (`isInMultiAction`, `userDesiredState`) の状態制御が正しいか
          - Vitest（fake timers とモック含む）のテストが変更に追随しているか
          - 型安全性、可読性、保守性、潜在バグ、セキュリティ上の懸念

          コメント運用ルール:
          - すべて日本語
          - インラインコメントは改善点・懸念点・バグ可能性のみ（肯定コメントは禁止）
          - 各コメントは先頭を `[MUST]` / `[SHOULD]` / `[NIT]` / `[FYI]` で始める
          - 各コメントは先頭1行で結論を示し、その後に「理由」「修正案」を書く
          - 修正方針が明確な場合は suggestion を使う
          - レビュー提出時の総括コメントは空文字列("")、`REQUEST_CHANGES` は使わない

          出力ルール:
          - `{ "comments": [...] }` の JSON オブジェクトのみを返す（Markdown や説明文は禁止）
          - 各要素は `path` / `line` / `body` を持つ
          - `line` は head file の行番号を返す（diff position ではない）
          - 指摘がない場合は `{ "comments": [] }` を返す

          Pull request number: #${{ github.event.pull_request.number }}
          Base SHA: ${{ github.event.pull_request.base.sha }}
          Head SHA: ${{ github.event.pull_request.head.sha }}

          Diff starts below.
          ===== BEGIN DIFF =====
          EOF
          cat pr.diff >> codex-review-prompt.md

      - name: Run Codex review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: codex-review-prompt.md
          output-file: codex-review.json
          sandbox: read-only
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["comments"],
              "properties": {
                "comments": {
                  "type": "array",
                  "maxItems": 20,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["path", "line", "body"],
                    "properties": {
                      "path": {
                        "type": "string",
                        "minLength": 1
                      },
                      "line": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "body": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 2000
                      }
                    }
                  }
                }
              }
            }

      - name: Post inline review comments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            function parseAddedLines(patch) {
              const added = new Set();
              if (!patch) return added;

              let newLine = 0;
              for (const row of patch.split('\n')) {
                if (row.startsWith('@@')) {
                  const match = row.match(/\+(\d+)(?:,\d+)?/);
                  if (match) {
                    newLine = Number(match[1]) - 1;
                  }
                  continue;
                }

                if (row.startsWith('+') && !row.startsWith('+++')) {
                  newLine += 1;
                  added.add(newLine);
                  continue;
                }

                if (row.startsWith('-') && !row.startsWith('---')) {
                  continue;
                }

                if (!row.startsWith('\\')) {
                  newLine += 1;
                }
              }

              return added;
            }

            const reviewPath = path.join(process.cwd(), 'codex-review.json');
            if (!fs.existsSync(reviewPath)) {
              core.info('codex-review.json not found; skipping inline review.');
              return;
            }

            let findings;
            try {
              const parsed = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
              findings = Array.isArray(parsed) ? parsed : (parsed?.comments ?? []);
            } catch (error) {
              core.warning(`Failed to parse codex-review.json: ${error.message}`);
              return;
            }

            if (!Array.isArray(findings) || findings.length === 0) {
              core.info('No findings from Codex.');
              return;
            }

            const prNumber = Number('${{ github.event.pull_request.number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const addedLinesByPath = new Map();
            for (const file of files) {
              if (file.status === 'removed') continue;
              addedLinesByPath.set(file.filename, parseAddedLines(file.patch));
            }

            const comments = [];
            const seen = new Set();
            let skipped = 0;

            for (const finding of findings) {
              const pathValue = typeof finding.path === 'string' ? finding.path.trim() : '';
              const lineValue = Number(finding.line);
              const bodyValue = typeof finding.body === 'string' ? finding.body.trim() : '';

              if (!pathValue || !Number.isInteger(lineValue) || lineValue < 1 || !bodyValue) {
                skipped += 1;
                continue;
              }

              const addedLines = addedLinesByPath.get(pathValue);
              if (!addedLines || !addedLines.has(lineValue)) {
                skipped += 1;
                continue;
              }

              const dedupeKey = `${pathValue}:${lineValue}:${bodyValue}`;
              if (seen.has(dedupeKey)) {
                continue;
              }
              seen.add(dedupeKey);

              comments.push({
                path: pathValue,
                line: lineValue,
                side: 'RIGHT',
                body: bodyValue,
              });
            }

            const maxComments = 30;
            const finalComments = comments.slice(0, maxComments);
            skipped += Math.max(0, comments.length - finalComments.length);

            if (finalComments.length === 0) {
              core.info('No valid inline comments to post after validation.');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: pr.head.sha,
              event: 'COMMENT',
              body: 'Codex による自動レビューコメントです。',
              comments: finalComments,
            });

            core.info(`posted=${finalComments.length}, skipped=${skipped}`);
