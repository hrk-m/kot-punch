name: PR Review via Codex (orchestrated by Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-with-tracking:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: PR Review via Codex
        uses: anthropics/claude-code-action@5754b35b0e8771a979727706b2a366dd5d7cf562 # v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            PR #${{ github.event.pull_request.number }} のコードレビューを以下の手順で実施してください。

            ## 手順

            1. `gh pr diff ${{ github.event.pull_request.number }}` で差分を取得し `/tmp/pr.diff` に保存する
            2. 以下のレビュー指示と差分を組み合わせたプロンプトを `/tmp/review-prompt.txt` に書き出す
            3. `codex exec -s read-only "$(cat /tmp/review-prompt.txt)"` で Codex にレビューを依頼する
            4. Codex の出力から各指摘（ファイルパス・行番号・コメント本文）を抽出する
            5. `mcp__github_inline_comment__create_inline_comment` で各指摘をインラインコメントとして投稿する

            ## /tmp/review-prompt.txt に書き出すレビュー指示

            以下の内容をそのまま `/tmp/review-prompt.txt` に書き出してから、末尾に `/tmp/pr.diff` の内容を追記すること。

            ---
            このリポジトリは Stream Deck プラグイン（TypeScript + Rollup + Vitest）です。
            以下の観点で差分をレビューし、指摘事項をファイルパス・行番号・コメント本文の形式で返してください。

            レビュー標準:
            - design / functionality / complexity / tests / naming / comments / style / consistency / documentation の順で確認する
            - 変更行だけでなく周辺コンテキストも読む（全差分を網羅）
            - 完璧さより「コードヘルスを確実に改善しているか」を重視する
            - 指摘は重要度順に優先し、些細な nit だけでレビューを埋めない

            プロジェクト固有チェック:
            - src/plugin.ts はアクション登録と streamDeck.connect() の責務に留まっているか
            - src/actions/*.ts で SingletonAction<Settings> / @action({ UUID }) の実装が適切か
            - manifest.json の Actions / UUID / UI / アイコン / Tooltip が実装と整合しているか
            - onKeyDown / onKeyUp の長押し判定タイマー、clearTimeout、短押し/長押し分岐が安全か
            - Multi Action (isInMultiAction, userDesiredState) の状態制御が正しいか
            - Vitest（fake timers とモック含む）のテストが変更に追随しているか
            - 型安全性、可読性、保守性、潜在バグ、セキュリティ上の懸念

            コメント運用ルール:
            - すべて日本語
            - インラインコメントは改善点・懸念点・バグ可能性のみ（肯定コメントは禁止）
            - 各コメントは先頭を [MUST] / [SHOULD] / [NIT] / [FYI] で始める
            - 各コメントは先頭1行で結論を示し、その後に「理由」「修正案」を書く

            以下が差分です:
            ---

          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(codex exec:*),Bash(cat:*),Bash(tee:*),Bash(printf:*),mcp__github_inline_comment__create_inline_comment,mcp__context7__*"
            --max-turns 20
