name: Codex

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned, edited]
  pull_request:
    types: [opened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited]

concurrency:
  group: codex-${{ github.event.issue.number || github.event.pull_request.number || github.event.number || github.run_id }}
  cancel-in-progress: false

jobs:
  codex:
    if: |
      github.actor != 'codex[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body || '', '@codex')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@codex')) ||
        (github.event_name == 'pull_request' && (contains(github.event.pull_request.body || '', '@codex') || contains(github.event.pull_request.title || '', '@codex'))) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body || '', '@codex') || contains(github.event.issue.title || '', '@codex')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Codex to read CI results on PRs
    steps:
      - name: Acknowledge mention with reaction
        if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api --method POST \
              /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
              -f content='eyes'
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            gh api --method POST \
              /repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}/reactions \
              -f content='eyes'
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Run Codex Action
        id: codex
        uses: openai/codex-action@c25d10f3f498316d4b2496cc4c6dd58057a7b031 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          
