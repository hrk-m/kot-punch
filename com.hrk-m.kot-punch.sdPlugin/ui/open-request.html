<!DOCTYPE html>
<html>

<head lang="en">
    <title>申請画面設定</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="申請画面URL">
        <sdpi-textfield global setting="requestUrl" placeholder="https://s3.ta.kingoftime.jp/admin"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="申請画面ユーザーID">
        <sdpi-textfield global setting="requestUsername" placeholder="admin_user"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="申請画面パスワード">
        <sdpi-password global setting="requestPassword" placeholder="password"></sdpi-password>
    </sdpi-item>
</body>

</html>
